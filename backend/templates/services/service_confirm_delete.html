{% extends "base.html" %}
{% block title %}Supprimer le service · HomeConnect{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-6 sm:p-8 text-center">
  <span class="material-symbols-outlined text-error text-5xl">delete</span>
  <h1 class="text-xl font-bold mt-2">Supprimer ce service ?</h1>
  <p class="text-sm text-on-surface-variant mt-2">
    « {{ service.name }} » sera supprimé définitivement.
  </p>
  <form method="post" class="mt-6 flex justify-center gap-3">
    {% csrf_token %}
    <a href="{% url 'service_list' %}" class="h-11 px-5 inline-flex items-center rounded-xl border border-outline-variant font-semibold hover:bg-surface-container transition">Annuler</a>
    <button type="submit" class="h-11 px-5 rounded-xl bg-error text-white font-semibold hover:opacity-90 transition">Oui, supprimer</button>
  </form>
</div>
{% endblock %}
