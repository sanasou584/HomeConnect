{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Mon profil{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-1">Mon profil</h2>
    <p class="text-muted">Rôle : <strong>{{ user.get_role_display }}</strong></p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary mt-2">Enregistrer</button>
    </form>
  </div>
</div>
{% endblock %}
